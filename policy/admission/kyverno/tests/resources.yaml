metadata:
  name: bad-deploy-registry-service-account
  namespace: agents-sandbox
  labels:
    app: bad-deploy-registry-service-account
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-deploy-registry-service-account
  template:
    metadata:
      labels:
        app: bad-deploy-registry-service-account
        membrane.io/agent-id: code-runner
        membrane.io/tier: '4'
      annotations:
        membrane.io/manifest-sha256: c66b040b5bc10e52d9a43ba59e78984abb0c05477cd7dd85f0559beb9c0cf3e9
    spec:
      serviceAccountName: kb-reader
      containers:
      - name: agent
        image: registry.example.com/agents/code-runner@sha256:4444444444444444444444444444444444444444444444444444444444444444
      automountServiceAccountToken: false
---
