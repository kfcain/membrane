[project]
name = "membrane"
version = "0.1.0"
description = "Agent containment and evidence reference: manifests, policy gates, gateway, checks, OSCAL output."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
membrane = "membrane.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["membrane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
